# 墨读 CI —— 每次 push / PR 到 main：前端门禁 + Rust 单测 + 敏感信息门禁。
#
# ⚠️ runner 必须是 windows-latest：本项目 Windows-only（Tauri 2 + WebView2），
#    ubuntu 上 cargo test 会因为缺 WebView2 直接失败。
#
# ⚠️ **更正（2026-09-27）**：本文件原先写着"**未在 GitHub 上真跑过**" ✗ —— 那是陈旧的 ✗。
#    实测（GitHub API）：该仓库 CI **已跑过 69 次**，最近几次都在 main 上：
#      ⭐ 敏感信息门禁 ⇒ success ✓ ｜ 前端门禁 ⇒ success ✓ ｜ **Rust 单测（cargo test）⇒ failure** ✗
#    ⇒ **main 的 CI 当前是红的，红在 `cargo test` 这个 job** ✓（失败日志需仓库管理员权限才能下载 ✗）。
#    ⚠ 本机 `cargo test` 是 **79 passed / 0 failed** ✓ ⇒ 差异**在 runner 环境**，不在产品代码 ✓
#    ⇒ 谁先拿到失败日志，请贴到 docs 里再动手改 ✓（别按猜测改代码 ✗）。
#    本地等价命令（均已实测通过，数值不写死 ✓）：
#      cd modu && pnpm install --frozen-lockfile && pnpm run check:full
#      cd modu/src-tauri && cargo test
#      scripts\check-sensitive.cmd
#
#
# ⭐ **2026-09-27 追加：干净 clone 复现实验（否定性结果，比猜测有价值 ✓）**
#    为了定位"main 的 cargo test job 为什么红"，本机做了**干净 clone 全流程**（clone 到工作区外，
#    避开工作区那个 Low 完整性标签 ✗ —— 见 modu/AGENTS.md）：
#      · 分支 feat/delivery-hardening（领先 main 37 提交）⇒ install 0 · build 0 · **cargo test 0**（79+4）✓
#      · ⭐ **main 本身（01befba，= CI 那次红所跑的提交）⇒ 同样全绿** ✓（59+4 passed，全量编译 89 秒）✓
#    ⇒ **"缺文件 / 未入库 / 干净 clone 建不出来"这一整类原因被排除** ✓
#      （本文件顶部曾担心的 `../dist` 缺失也已被上面的"前端产物"步覆盖 ✓）
#    ⇒ 剩下的候选**只在 runner 侧**：镜像差异（WebView2 / MSVC / Node 22）·
#      `Swatinem/rust-cache@v2` 的**陈旧缓存**（经典成因 ✓）· `actions/*` 行为
#    ⚠ **结论：不许按猜测改代码** ✓ —— 要么拿到失败日志（需仓库管理员 ✗），
#      要么用 `workflow_dispatch` 在**任意分支**上真跑一次看是否复现 ✓（见下面 on: 段 ✓）
# 大件（MSI ≤8MB）走单独的手动工作流 `msi-size.yml`，不塞进每次 push。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ⭐ 2026-09-27 新增：**手动触发**（Actions 页面点 "Run workflow" ✓）
  #    为什么需要：上面的 push 只监听 main ⇒ **推 feature 分支根本不会跑 CI** ✗
  #    （实测：推 feat/delivery-hardening 后 `?branch=` 查到的 run 数 = **0** ✓）
  #    ⇒ 有了它，任意分支都能在 GitHub 上真跑一次 ✓（这也是"CI 真跑一次"的可行路径 ✓）
  workflow_dispatch:

# 最小权限：CI 只读仓库
permissions:
  contents: read

# 同一分支的新提交取消旧的跑批
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端门禁（tsc + eslint + vitest）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modu/pnpm-lock.yaml
      - name: 安装依赖（严格按锁文件）
        run: pnpm install --frozen-lockfile
      - name: pnpm run check:full（tsc ×2 + eslint + vitest + vite build）
        run: pnpm run check:full

  rust:
    name: Rust 单测（cargo test）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modu/pnpm-lock.yaml
      # `tauri::generate_context!` 在编译期会校验 frontendDist（../dist），
      # 所以 cargo test 之前必须先产出前端产物，否则会以"dist 不存在"失败。
      - name: 前端产物（generate_context! 需要 ../dist）
        working-directory: modu
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modu/src-tauri
      - name: cargo test（含 R-01 受信路径单测）
        working-directory: modu/src-tauri
        run: cargo test

  sensitive:
    name: 敏感信息门禁
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁扫的是 `git ls-files`，需要完整历史以拿到 tracked 清单
          fetch-depth: 0
      # 词条清单 scripts/.sensitive-extra.txt 是 gitignored 的，CI 里必然缺失：
      # 脚本会降级成"只跑通用模式"并给出 WARNING，但**仍然返回 0**（不能因为没有词条就不跑）。
      - name: 运行门禁（非零即失败）
        shell: cmd
        run: scripts\check-sensitive.cmd
