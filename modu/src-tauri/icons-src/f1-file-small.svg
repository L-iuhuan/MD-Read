<?xml version="1.0" encoding="UTF-8"?>
<!--
  MoDu f1 file icon, bold small-size variant (for 16 to 32 px entries only).
  Same pixel-first language as f1-app-small: flat fills, ink page frame with
  a 64u wall, flat cool-white paper, heavy M-down mark and a short cinnabar
  bookmark. The mark is larger than in the app variant (about 61 percent of
  the canvas) so the file type reads first in Explorer lists.
  Palette: paper #F4F8FC, ink #22384D, cinnabar #D9532B.
  Zero external references; no fonts; pure vector.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="64" y="64" width="896" height="896" rx="96" fill="#22384D"/>
  <rect x="128" y="128" width="768" height="768" rx="32" fill="#F4F8FC"/>
  <path d="M160 64H256V168L208 140L160 168Z" fill="#D9532B"/>
  <g transform="translate(192 200) scale(0.625)">
    <path d="M12 12H208V1012H12ZM816 12H1012V1012H816ZM208 12L512 720L816 12V300L600 880L676 1012H348L424 880L208 300Z" fill="#22384D"/>
  </g>
</svg>
