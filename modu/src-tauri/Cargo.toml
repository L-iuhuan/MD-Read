[package]
name = "modu"
version = "0.1.0"
description = "MoDu - a personal Windows Markdown reader and PDF exporter"
authors = ["LIUHUAN <noreply@example.com>"]
license = "MIT"
repository = "https://github.com/L-iuhuan/MD-Read"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 鏄繀闇€鐗规€э細asset 鍗忚锛堢浉瀵瑰浘 convertFileSrc锛変笌
# `asset_protocol_scope()` 杩愯鏃舵巿鏉?API 閮借瀹冮棬鎺э紝缂轰簡瀹冩暣鏉″浘鐗囬摼璺棤鏁堛€?
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 09-25 取证用日志接收器依赖（随未提交诊断代码）
log = "0.4"
webview2-com = "0.38"
windows-core = "0.61"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
chardetng = "1.0.0"
encoding_rs = "0.8.41"
tauri-plugin-opener = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# ⛔ 这里曾有一个 `[patch.crates-io] webview2-com-sys = { path = "../vendor/webview2-com-sys" }`
#    （"动态加载器"实验）。**已于 2026-09-27 撤除，请勿恢复** ✗：
#    · 它让 exe 在**加载期**依赖 `WebView2Loader.dll`（PE 导入表非延迟加载，实测）；
#    · 而该 DLL 既不随 MSI/NSIS 发布、`modu/vendor/` 也已删除 ⇒ 恢复它 = 干净 clone
#      **构建不出来**（CI 红）+ 换台机器**极可能起不来**；
#    · 实测：撤除后回到静态链接 loader，per-user 目录连跑 3/3 成功 ✓。
#    详见 docs/tasks/2026-09-27-排障复盘与对抗式审查报告.md 与 AGENTS.md「启动类故障排查」。
