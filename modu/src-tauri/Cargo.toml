[package]
name = "modu"
version = "0.1.0"
description = "MoDu - a personal Windows Markdown reader and PDF exporter"
authors = ["LIUHUAN <noreply@example.com>"]
license = "MIT"
repository = "https://github.com/L-iuhuan/MD-Read"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 是必需特性：asset 协议（相对图 convertFileSrc）与
# `asset_protocol_scope()` 运行时授权 API 都被它门控，缺了它整条图片链路无效。
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.38"
windows-core = "0.61"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
chardetng = "1.0.0"
encoding_rs = "0.8.41"
tauri-plugin-opener = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
