<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨读 MoDu</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- 自定义标题栏（M2 波3 反馈⑤：无边框轻盈感，tauri decorations:false）
           波5 反馈③：标签行并入本行，浏览器式排布 —— [标签起始居左][弹性留白][墨读][三窗钮]；
           拖拽区语义保留：标签行（含标签之间的空隙）、弹性留白与「墨读」都可拖。
           ⚠ 拖拽区只写在 .titlebar-drag / #tabbar / #tab-list 上，不写 #titlebar：
             双击最大化由 main.ts 绑在 .titlebar-drag 上，若父层再声明一次会双触发。 -->
      <header id="titlebar" class="titlebar" aria-label="窗口标题栏">
        <div id="tabbar" class="tabbar" data-tauri-drag-region hidden>
          <div id="tab-list" class="tab-list" role="tablist" data-tauri-drag-region></div>
          <button id="btn-newtab" type="button" title="打开文件（新标签）">+</button>
        </div>
        <div class="titlebar-drag" data-tauri-drag-region>
          <span class="titlebar-title" data-tauri-drag-region>墨读</span>
        </div>
        <!-- 窗口三钮：内联 SVG —— 统一 16×16 视觉盒，盒内自绘 10px 线条（1px 发丝、居中），
             三枚同色同尺寸，只有 close 的热区更宽（54px，图标仍居中）。颜色走 currentColor。 -->
        <button id="win-min" type="button" title="最小化" aria-label="最小化">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges">
            <path d="M3 8.5h10" />
          </svg>
        </button>
        <button id="win-max" type="button" title="最大化 / 还原（双击标题栏同效）" aria-label="最大化或还原">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges">
            <rect x="3.5" y="3.5" width="9" height="9" />
          </svg>
        </button>
        <button id="win-close" type="button" title="关闭" aria-label="关闭窗口">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" />
          </svg>
        </button>
      </header>
      <header class="topbar">
        <!-- ☰ 大纲折叠（P5 批2）：toggle body.outline-off，态存 localStorage modu-outline -->
        <button id="btn-outline" type="button" title="显示/隐藏大纲" aria-label="显示或隐藏大纲">☰</button>
        <button id="btn-open" type="button" title="打开 Markdown 文件">打开…</button>
        <span id="doc-title" class="doc-title" title="当前文件">未打开文件</span>
        <div id="recent-wrap" class="recent-wrap">
          <button id="btn-recent" type="button" title="最近打开的文件">最近</button>
          <div id="recent-menu" class="recent-menu" hidden></div>
        </div>
        <span class="topbar-spacer"></span>
        <div class="settings-wrap">
          <button id="btn-settings" type="button" title="字体与外观设置" aria-label="打开字体与外观设置面板">Aa</button>
          <!-- 「Aa」设置面板（M2 波3 反馈⑥：字号/字体/主题；波4 起为卡片化浮层） -->
          <div id="settings-panel" class="settings-panel" hidden aria-label="字体与外观设置">
            <div class="settings-row">
              <span class="settings-label" id="set-fs-label">字号</span>
              <div class="settings-fs" role="group" aria-labelledby="set-fs-label">
                <button id="set-fs-dec" type="button" title="减小字号" aria-label="减小字号">−</button>
                <span id="set-fs-val">16</span>
                <button id="set-fs-inc" type="button" title="增大字号" aria-label="增大字号">＋</button>
              </div>
            </div>
            <div class="settings-row">
              <label class="settings-label" for="set-font">字体</label>
              <select id="set-font" title="正文字体" aria-label="正文字体">
                <option value="sans">微软雅黑</option>
                <option value="serif">宋体（衬线）</option>
                <option value="kai">楷体</option>
                <option value="hei">黑体</option>
              </select>
            </div>
            <div class="settings-row">
              <label class="settings-label" for="set-theme">主题</label>
              <select id="set-theme" title="界面主题" aria-label="界面主题">
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </div>
          </div>
        </div>
        <button id="btn-theme" type="button" title="切换亮暗主题">◐</button>
        <button id="btn-edit" type="button" title="编辑 / 阅读（Ctrl+E）" aria-label="切换编辑与阅读模式" disabled>✎ 编辑</button>
        <button id="btn-export" type="button" title="导出 PDF（M4 提供）" disabled>⇩ PDF</button>
      </header>
      <div id="findbar" class="findbar" hidden>
        <input id="find-input" type="text" placeholder="查找…" aria-label="查找内容" />
        <span id="find-count" class="find-count">0/0</span>
        <button id="find-prev" type="button" title="上一个（Shift+Enter）">↑</button>
        <button id="find-next" type="button" title="下一个（Enter）">↓</button>
        <button id="find-close" type="button" title="关闭（Esc）">✕</button>
      </div>
      <div class="body-row">
        <aside id="outline" class="outline" aria-label="文档大纲">
          <div class="outline-title">大纲</div>
          <nav id="outline-list" class="outline-list"></nav>
        </aside>
        <main id="content" class="content">
          <div id="empty-hint" class="empty-hint">拖入 .md 文件，或点「打开…」</div>
          <article id="doc" class="mdc" hidden></article>
          <!-- M3 编辑态（F7）：CM6 常驻容器，与 #doc 互斥显隐；高度由 editor.ts 内联撑满 -->
          <div id="editor-pane" class="editor-pane" hidden aria-label="源码编辑区"></div>
        </main>
      </div>
      <footer class="statusbar">
        <span id="st-encoding">—</span>
        <!-- 行号（P5 批2）：阅读态=视口首个 [data-line] 块；编辑态=切态回填 -->
        <span id="st-line" hidden></span>
        <span id="st-saved" hidden aria-live="polite"></span>
        <span class="statusbar-spacer"></span>
        <span id="st-progress">0%</span>
      </footer>
    </div>
  </body>
</html>
