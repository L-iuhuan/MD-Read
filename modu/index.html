<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FOUC 防闪（用户实测启动时简陋界面一闪）：内联关键样式随 HTML 首帧前生效，
         main.ts 的 boot() 应用完主题/字号偏好后再给 html 加 .app-ready 放行——
         同时消灭无样式闪屏与主题闪错。JS 是应用的运行前提，失败时隐藏可接受。 -->
    <style>html:not(.app-ready) body{visibility:hidden}</style>
    <title>墨读 MoDu</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- 单栏合并顶栏（D-05 · T1「单栏合并」，实测高 48px = --h-chrome）——
           旧「标题栏(36px) + 顶栏(40px)」两层合并为一条，省出 32px 正文高度。
           排布：[☰ 大纲][标签 chip 组 + ＋][‹ › ▾ 导航组][动作区][窗口三钮]。
           中间那个「与标签重复的文件名」已去（文档名改由窗口标题承担）。
           拖拽区语义：data-tauri-drag-region **只写在标签条容器上**（与合并前一致）。
           ⚠ 故意不写在本 <header> 上：该属性会把元素的**按下即拖拽**接管掉，写在
             容器上会与子元素（标签 / 动作按钮 / 三窗钮）抢手势——标签条空档本来
             就是整条栏里最大的一块热区，够用。
           双击最大化由 main.ts 绑在 header 上并按事件目标排除控件（见 setupWindowControls）。
           窗口三钮：内联 SVG —— 统一 16×16 视觉盒，盒内自绘 10px 线条（1px 发丝、居中），
           三枚同色同尺寸，只有 close 的热区更宽（54px，图标仍居中）。颜色走 currentColor。
           max 钮双态（用户反馈批次）：单框=最大化 / 双框=向下还原，main.ts 依
           isMaximized 切换（onResized 监听），title/aria 同步。 -->
      <header id="titlebar" class="topbar" aria-label="窗口标题栏与工具栏">
        <!-- ☰ 大纲折叠（P5 批2）：toggle body.outline-off，态存 localStorage modu-outline -->
        <button id="btn-outline" type="button" title="显示/隐藏大纲" aria-label="显示或隐藏大纲">☰</button>
        <!-- 标签条：占满整条栏高（align-self: stretch 由 CSS 给 —— 不 stretch 会让下划线与
             分隔线错位 10~20px，见 app.css §3 的实测值）。标签之间 1px×14px 细分隔线；
             ‹ › ▾ 导航组只在「标签确有溢出」时出现。
             ＋ 是 #tab-list 的**最后一个孩子**（不是它的兄弟）——这是本批的核心改动：
             只有身在滚动容器内部，`position: sticky; inset-inline-end: 0` 才同时给出
             用户要的两段语义：装得下时在流内紧跟最后一枚标签，装不下/往左滚时钉在
             滚动视口右缘（#tabs-nav、#actions 都在它之后，故钉子位置恒在这些按钮左侧）。
             非活动标签与「关闭其他/全部标签」经 ⋯ / ▾ 菜单可达，键盘焦点不会被单行滚动藏掉。
             ⚠ 标签条**不再带 hidden**（空态也要显示）：空态里 #tab-list 只有 ＋ 一个孩子，
             它自然落在 ☰ 右侧——这也是空态唯一的可见文件入口。 -->
        <div id="tabbar" class="tabbar" data-tauri-drag-region>
          <div id="tab-list" class="tab-list" role="tablist" data-tauri-drag-region><button id="btn-newtab" type="button" title="打开文件（新标签）" aria-label="打开文件（新标签）">＋</button></div>
        </div>
        <div id="tabs-nav" class="tabs-nav" hidden>
          <button id="tabs-prev" type="button" title="向左滚动标签（左侧还有标签）" aria-label="向左滚动标签条" disabled>‹</button>
          <button id="tabs-next" type="button" title="向右滚动标签（右侧还有标签）" aria-label="向右滚动标签条" disabled>›</button>
          <button id="tabs-list" type="button" class="tabs-list-btn" title="全部标签" aria-label="列出全部标签" aria-haspopup="menu" aria-expanded="false">▾</button>
          <div id="tabs-menu" class="tabs-menu" role="menu" aria-label="全部标签" hidden></div>
        </div>
        <span id="act-sep" class="act-sep"></span>
        <div id="actions" class="actions">
          <!-- 强调按钮：全条唯一的软底主色按钮（其余动作都是纸面填充的发丝线按钮） -->
          <button id="btn-edit" type="button" class="is-accent" title="编辑 / 阅读（Ctrl+E）" aria-label="切换编辑与阅读模式" disabled>编辑</button>
          <!-- 「打开」按钮已删（本批）：它与标签条的 #btn-newtab（＋）绑同一处理函数
               （main.ts 注释原文「标签栏「+」= 打开」），两者做同一件事；＋ 恒在标签条上
               且 sticky 钉在可视区右端，是**唯一的文件入口**。-->
          <div id="recent-wrap" class="recent-wrap">
            <button id="btn-recent" type="button" title="最近打开的文件">最近</button>
            <div id="recent-menu" class="recent-menu" hidden></div>
          </div>
          <div class="settings-wrap">
            <button id="btn-settings" type="button" title="字体与外观设置" aria-label="打开字体与外观设置面板">Aa</button>
            <!-- 「Aa」设置面板（M2 波3 反馈⑥：字号/字体/主题；波4 起为卡片化浮层） -->
            <div id="settings-panel" class="settings-panel" hidden aria-label="字体与外观设置">
              <div class="settings-row">
                <span class="settings-label" id="set-fs-label">字号</span>
                <div class="settings-fs" role="group" aria-labelledby="set-fs-label">
                  <button id="set-fs-dec" type="button" title="减小字号" aria-label="减小字号">−</button>
                  <span id="set-fs-val">16</span>
                  <button id="set-fs-inc" type="button" title="增大字号" aria-label="增大字号">＋</button>
                </div>
              </div>
              <!-- 行宽（用户反馈批次·新功能）：40–60em 步进 2，写 --me-width（--measure 派生链） -->
              <div class="settings-row">
                <span class="settings-label" id="set-width-label">行宽</span>
                <div class="settings-fs" role="group" aria-labelledby="set-width-label">
                  <button id="set-width-dec" type="button" title="减小行宽" aria-label="减小行宽">−</button>
                  <span id="set-width-val">46</span>
                  <button id="set-width-inc" type="button" title="增大行宽" aria-label="增大行宽">＋</button>
                </div>
              </div>
              <!-- 字体（D-02）：推荐列表 = 中文正文 / 西文拉丁 / 代码 三组语义分组。
                   这里只放「id + 中文名 + 它对应 tokens.css 里的哪个栈变量」；
                   栈本身（完整回退链）与首选族名只写在 tokens.css 的 --font-pick-* 里，
                   ui/font-catalog.ts 运行时读 CSSOM 取回，故 TS/CSS 逻辑文件零字体族名字面值。
                   选项文案由 ui/font-picker.ts 按可用性补「（本机未安装）」标注。
                   下面一行是本步最关键的常显项：**当前实际渲染出来的族名**，
                   用拉丁串字宽在 400/700 两个字重上实测——「选了 A 实际是 B」由此直接暴露。 -->
              <div class="settings-row settings-font">
                <label class="settings-label" for="set-font">字体</label>
                <select id="set-font" class="settings-select" title="正文字体" aria-label="正文字体">
                  <optgroup label="中文正文" data-group="cjk">
                    <option value="cjk-harmonyos" data-stack-var="--font-pick-cjk-harmonyos">HarmonyOS Sans SC</option>
                    <option value="cjk-yahei" data-stack-var="--font-pick-cjk-yahei">微软雅黑</option>
                    <option value="cjk-lxgw" data-stack-var="--font-pick-cjk-lxgw">霞鹜文楷 屏幕版</option>
                    <option value="cjk-songti" data-stack-var="--font-pick-cjk-songti">宋体</option>
                    <option value="cjk-notoserif" data-stack-var="--font-pick-cjk-notoserif">思源宋体（Noto Serif SC）</option>
                  </optgroup>
                  <optgroup label="西文拉丁" data-group="latin">
                    <option value="latin-inter" data-stack-var="--font-pick-latin-inter">Inter</option>
                    <option value="latin-segoe" data-stack-var="--font-pick-latin-segoe">Segoe UI Variable Text</option>
                    <option value="latin-georgia" data-stack-var="--font-pick-latin-georgia">Georgia（衬线）</option>
                    <option value="latin-times" data-stack-var="--font-pick-latin-times">Times New Roman（衬线）</option>
                    <option value="latin-yaheiui" data-stack-var="--font-pick-latin-yaheiui">Microsoft YaHei UI</option>
                  </optgroup>
                  <optgroup label="代码" data-group="mono">
                    <option value="mono-maple-nf" data-stack-var="--font-pick-mono-maple-nf">Maple Mono NF</option>
                    <option value="mono-maple" data-stack-var="--font-pick-mono-maple">Maple Mono（变量版）</option>
                    <option value="mono-cascadia" data-stack-var="--font-pick-mono-cascadia">Cascadia Mono</option>
                    <option value="mono-consolas" data-stack-var="--font-pick-mono-consolas">Consolas</option>
                    <option value="mono-maple-mix" data-stack-var="--font-pick-mono-maple-mix">Maple Mono NF（中文回雅黑）</option>
                  </optgroup>
                </select>
              </div>
              <div class="settings-row settings-effective">
                <span class="settings-label">实际生效</span>
                <code id="set-font-effective" data-role="font-effective" title="当前正文字体在 400 字重下实际渲染的字体族（拉丁串字宽探测）">检测中…</code>
                <code id="set-font-effective-bold" data-role="font-effective-bold" title="加粗（700 字重）实际渲染的字体族；与 400 不同时会另有提示">检测中…</code>
                <span id="set-font-hint" class="settings-effective-hint" data-role="font-effective-hint">正在探测本机字体…</span>
              </div>
              <div class="settings-row">
                <label class="settings-label" for="set-theme">主题</label>
                <select id="set-theme" title="界面主题" aria-label="界面主题">
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                  <option value="auto">自动（跟随系统）</option>
                </select>
              </div>
              <!-- 配色（D-01）：5 套主题 × （上面的亮/暗/自动）= 10 组调色板；
                   data-palette 是新维度，data-theme 语义不变（见 tokens.css 顶部契约）。 -->
              <div class="settings-row">
                <label class="settings-label" for="set-palette">配色</label>
                <select id="set-palette" title="主题配色" aria-label="主题配色">
                  <option value="dianlan">靛蓝</option>
                  <option value="xuanzhi">宣纸</option>
                  <option value="shimo">石墨</option>
                  <option value="zidai">紫黛</option>
                  <option value="qingmo">青墨</option>
                </select>
              </div>
              <!-- 自动保存开关（用户反馈批次）：默认开，modu-autosave 持久化 -->
              <div class="settings-row">
                <label class="settings-label" for="set-autosave">自动保存</label>
                <input id="set-autosave" type="checkbox" checked
                       title="编辑时改动停顿 2 秒后自动保存" aria-label="编辑时自动保存" />
              </div>
            </div>
          </div>
          <button id="btn-theme" type="button" title="切换亮暗主题">◐</button>
          <button id="btn-export" type="button" title="导出 PDF" disabled>PDF</button>
          <!-- ⋯ 溢出菜单（D-05 新增功能）：**只在拥挤态可见**。本批收口后拥挤态只剩
               「编辑 + ⋯」，其余动作（最近 / Aa / ◐ / PDF）与标签批量操作全收进这里；
               非拥挤态它们是常显按钮，⋯ 整个不出现（含占位，见 app.css §5）。
               ⚠ DOM 位置固定在本动作区**末尾**（PDF 之后、窗口三钮之前）——用户实测
                 「编辑右边的按钮是什么？」的根因就是它原先夹在 #btn-edit 与已删除的
                 那枚「打开」按钮之间。菜单是 .overflow-wrap 的绝对定位子元素（右对齐到
                 按钮右沿，见 app.css §7c），移到末尾后右边缘距窗口右边界仍有整排窗口
                 三钮的余量，故拥挤/非拥挤两态都不会出窗。 -->
          <div id="overflow-wrap" class="overflow-wrap">
            <button id="btn-overflow" type="button" title="更多操作" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" hidden>⋯</button>
            <div id="overflow-menu" class="overflow-menu" role="menu" aria-label="更多操作" hidden></div>
          </div>
        </div>
        <button id="win-min" type="button" title="最小化" aria-label="最小化">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges">
            <path d="M3 8.5h10" />
          </svg>
        </button>
        <button id="win-max" type="button" title="最大化" aria-label="最大化">
          <svg id="ic-max" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges">
            <rect x="3.5" y="3.5" width="9" height="9" />
          </svg>
          <svg id="ic-restore" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" shape-rendering="crispEdges" hidden>
            <rect x="3.5" y="5.5" width="7" height="7" />
            <path d="M5.5 5.5v-2h7v7h-2" />
          </svg>
        </button>
        <button id="win-close" type="button" title="关闭" aria-label="关闭窗口">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"
               fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" />
          </svg>
        </button>
      </header>
      <div id="findbar" class="findbar" hidden>
        <input id="find-input" type="text" placeholder="查找…" aria-label="查找内容" />
        <span id="find-count" class="find-count">0/0</span>
        <button id="find-prev" type="button" title="上一个（Shift+Enter）">↑</button>
        <button id="find-next" type="button" title="下一个（Enter）">↓</button>
        <button id="find-close" type="button" title="关闭（Esc）">✕</button>
      </div>
      <div class="body-row">
        <aside id="outline" class="outline" aria-label="文档大纲">
          <div class="outline-title">大纲</div>
          <nav id="outline-list" class="outline-list"></nav>
        </aside>
        <main id="content" class="content">
          <!-- 空态（首访欢迎页，2026-09-23 第二批落地·用户选 V1「克制」稿）：
               此前这里只有一行灰字提示，且提示指向的「＋」在空态里根本不可见 ——
               **空态没有任何可见的文件入口**，这是本批的根本修复。
               结构：品牌词标 → 主行动按钮 → 两枚入口提示（拆开）→ 最近打开（可空）→ 快捷键脚注。
               判据仍是 body.empty（与 .empty .outline / .empty #btn-outline 同源，不另立第二套）。
               #empty-recent 无最近时带 hidden（全局 [hidden] 兜底规则保证它真不显示）。 -->
          <div id="empty-hint" class="empty-hint">
            <section class="empty-panel" aria-label="欢迎">
              <div class="empty-brand">
                <div class="empty-wordmark">墨读</div>
                <div class="empty-rule" aria-hidden="true"></div>
                <div class="empty-sub">本地 Markdown 阅读器</div>
              </div>
              <button id="empty-open" type="button" class="empty-primary">打开 Markdown 文件</button>
              <div class="empty-entries">
                <div class="empty-entry">
                  <span class="empty-ico" aria-hidden="true">⇣</span>
                  <span class="empty-entry-text"><b>拖入 .md 文件</b><span>松手即开</span></span>
                </div>
                <div class="empty-entry">
                  <span class="empty-ico" aria-hidden="true">⏎</span>
                  <span class="empty-entry-text"><b>双击 .md 关联打开</b><span>已在系统关联</span></span>
                </div>
              </div>
              <div id="empty-recent" class="empty-recent" hidden>
                <div class="empty-recent-head">
                  <span>最近打开</span>
                  <span id="empty-recent-count"></span>
                </div>
                <div id="empty-recent-list" class="empty-recent-list"></div>
              </div>
              <div class="empty-foot">
                打开文档后按 <code>Ctrl+E</code> 进入编辑，<code>Ctrl+P</code> 导出 PDF
              </div>
            </section>
          </div>
          <article id="doc" class="mdc" hidden></article>
          <!-- M3 编辑态（F7）：CM6 常驻容器，与 #doc 互斥显隐；高度由 editor.ts 内联撑满 -->
          <div id="editor-pane" class="editor-pane" hidden aria-label="源码编辑区"></div>
        </main>
      </div>
      <footer class="statusbar">
        <span id="st-encoding">—</span>
        <!-- 行号（P5 批2）：阅读态=视口首个 [data-line] 块；编辑态=切态回填 -->
        <span id="st-line" hidden></span>
        <span id="st-saved" hidden aria-live="polite"></span>
        <span class="statusbar-spacer"></span>
        <span id="st-progress">0%</span>
      </footer>
    </div>
  </body>
</html>
